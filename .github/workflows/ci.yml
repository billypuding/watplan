name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:v0.24.33
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: wait for libsql
        run: for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 1; done; exit 1

      - name: start s3 gateway
        run: |
          docker run -d -p 7070:7070 -e ROOT_ACCESS_KEY=testkey -e ROOT_SECRET_KEY=testsecret123 versity/versitygw:v1.11.0 posix /tmp
          for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7070/)" = 403 ] && exit 0; sleep 1; done; exit 1

      - name: go test
        env:
          PLANWAT_TEST_DB_URL: http://127.0.0.1:8080
          PLANWAT_TEST_S3_URL: http://127.0.0.1:7070
          PLANWAT_TEST_S3_KEY: testkey
          PLANWAT_TEST_S3_SECRET: testsecret123
        run: go test ./...

      - name: e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node --test e2e/*.test.mjs
