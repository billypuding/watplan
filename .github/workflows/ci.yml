name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node --test e2e/*.test.mjs
