<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WATplan</title>
    <meta name="description" content="WATplan to szybki i czytelny plan zajęć dla studentów Wojskowej Akademii Technicznej. Pozwala na błyskawiczne wyszukiwanie grup i nawigację po tygodniach.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="7243e5ff-b868-43e2-819c-6f42ffe95547"></script>
</head>
<body>
    <div class="top-bar">
        <div class="controls-wrapper">
            <div class="control-group search-group">
                <label for="planSearch">Grupa:</label>
                <div class="search-container">
                    <input type="text" id="planSearch" placeholder="Szukaj (np. WEL...)" autocomplete="off">
                    <div id="searchResults" class="search-results hidden"></div>
                </div>
            </div>

            <div class="control-group week-nav">
                <label for="weekSelector">Tydzień:</label>
                <div class="nav-buttons">
                    <button id="prevWeekBtn" class="icon-btn" disabled>‹</button>
                    <select id="weekSelector"></select>
                    <button id="nextWeekBtn" class="icon-btn" disabled>›</button>
                </div>
            </div>
        </div>

        <div class="actions-wrapper">
            <button id="refreshButton" class="primary-btn" type="button">Odśwież z serwera</button>
            <button id="themeToggle" class="theme-btn" type="button">☀️</button>
        </div>

        <div class="status">
            Pobrano: <b id="fetched">-</b><br>
            Zmodyfikowano: <b id="modified">-</b>
            <div id="notice" class="notice" role="status"></div>
        </div>
    </div>

    <div class="calendar-container">
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <footer class="app-footer">
        Made by: <a href="https://github.com/billypuding/watplan" target="_blank" rel="noopener noreferrer">billypuding</a> | Kontakt: <a href="mailto:awalczak@duck.com">awalczak@duck.com</a>
    </footer>

    <script src="app.js"></script>
</body>
</html>
