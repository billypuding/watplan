<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WATplan – plan zajęć</title>
<meta name="description" content="Twój plan zajęć WAT: dzień, tydzień i miesiąc, licznik „Ile jeszcze”, ulubione plany i eksport do kalendarza.">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta property="og:site_name" content="watplan.me">
<meta property="og:title" content="WATplan – szybki plan zajęć WAT">
<meta property="og:description" content="Za darmo i bez logowania. Wpisz grupę i od razu widzisz, gdzie masz zajęcia.">
<link rel="canonical" href="https://watplan.me/app">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="apple-touch-icon" href="/favicon.png?v=2">
<link rel="manifest" href="/manifest.json?v=1">
<meta name="apple-mobile-web-app-title" content="WATplan">
<link rel="preload" href="/fonts/bricolage-latin.woff2?v=1" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/bricolage-pl.woff2?v=1" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css?v=9">
<script src="/theme.js"></script>
<script defer src="https://cloud.umami.is/script.js" data-website-id="7243e5ff-b868-43e2-819c-6f42ffe95547"></script>
</head>
<body>
<div class="app" id="app">
  <header class="app-head">
    <button id="groupBtn" class="chip-btn" type="button" aria-haspopup="dialog">
      <span id="groupLabel">Wybierz grupę</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="head-actions">
      <button id="todayBtn" class="today-btn hidden" type="button">Dziś</button>
      <button id="refreshButton" class="round-btn" type="button" aria-label="Odśwież plan" title="Odśwież plan">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button id="settingsBtn" class="round-btn" type="button" aria-label="Ustawienia" title="Ustawienia" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <nav id="favBar" class="fav-bar" aria-label="Ulubione plany" hidden></nav>

  <p id="staleBanner" class="stale-banner hidden" role="status"></p>

  <main id="view" class="view" aria-live="polite"></main>

  <footer class="app-footer">
    Autor: <a href="https://github.com/billypuding/watplan" target="_blank" rel="noopener noreferrer">billypuding</a>
    · Kontakt: <a href="mailto:awalczak@duck.com">awalczak@duck.com</a>
  </footer>
</div>

<div id="notice" class="notice" role="status"></div>

<dialog id="groupModal" class="sheet">
  <div class="sheet-head">
    <h2>Grupa</h2>
    <button class="round-btn" type="button" data-close aria-label="Zamknij">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <section id="favSection" class="fav-section" hidden>
    <h3>Ulubione</h3>
    <div id="favList" class="fav-list"></div>
  </section>
  <label class="search-field">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="planSearch" placeholder="np. WEL26EY4S0" autocomplete="off" autocapitalize="characters" aria-label="Szukaj grupy">
  </label>
  <div id="searchResults" class="search-results"></div>
</dialog>

<dialog id="settingsModal" class="sheet">
  <div class="sheet-head">
    <h2>Ustawienia</h2>
    <button class="round-btn" type="button" data-close aria-label="Zamknij">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <section class="setting">
    <h3>Widok planu</h3>
    <div class="segmented" data-setting="view">
      <button type="button" data-value="agenda">Dzień</button>
      <button type="button" data-value="week">Tydzień</button>
      <button type="button" data-value="month">Miesiąc</button>
    </div>
  </section>

  <section class="setting">
    <h3>Motyw</h3>
    <div class="segmented" data-setting="theme">
      <button type="button" data-value="auto">Auto</button>
      <button type="button" data-value="light">Jasny</button>
      <button type="button" data-value="dark">Ciemny</button>
    </div>
  </section>

  <section class="setting">
    <label class="switch"><input type="checkbox" id="optLive"><span>Pasek postępu bieżących zajęć</span></label>
    <label class="switch"><input type="checkbox" id="optDimPast"><span>Przyciemnij zajęcia, które już się skończyły</span></label>
  </section>

  <section class="setting">
    <h3>Plan w kalendarzu</h3>
    <p class="hint">Plik .ics zaimportujesz do Google Calendar, Apple Calendar i Outlooka.</p>
    <button id="downloadIcs" class="primary-btn" type="button">Pobierz plan (.ics)</button>
  </section>

  <section class="setting status">
    <span>Pobrano: <b id="fetched">-</b></span>
    <span>Zmodyfikowano: <b id="modified">-</b></span>
    <a class="about-link" href="/o-watplan">O WATplan</a>
  </section>
</dialog>

<dialog id="seriesModal" class="fullscreen">
  <div class="series-head">
    <button id="seriesBack" class="round-btn" type="button" aria-label="Wróć">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="series-title">
      <h2 id="seriesSubject"></h2>
      <p id="seriesSub"></p>
    </div>
  </div>
  <div id="seriesBody" class="series-body"></div>
</dialog>

<script src="/groups.js?v=2"></script>
<script src="/app.js?v=9"></script>
</body>
</html>
